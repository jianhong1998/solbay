[toolchain]
anchor_version = "0.31.1"
solana_version="2.1.21"
channel = "1.76.0"

[env]
RUSTUP_TOOLCHAIN = "nightly-2025-04-01"

[features]
resolution = true
skip-lint = false

[programs.localnet]
solbay = "DsEJ8Xoffs9GSDhzPV3iUi7LskYSJxUKfhgotnWbUpme"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "../keypairs/program-owner.json"

[scripts]
test = "./node_modules/.bin/vitest --run --dir ./"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899
